<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bảng Gõ Tiếng Việt Trợ Năng</title>
  
  <!-- FONT CHỮ HIỆN ĐẠI CHUYÊN DỤNG CHO TIẾNG VIỆT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#f8fafc">
</head>
<body>
  <!-- TOAST THÔNG BÁO -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <div class="app-shell">

    <!-- 1. HEADER TINH TẾ -->
    <header class="app-header">
      <div class="header-brand">
        <span class="brand-badge">BÀ GÕ CHỮ</span>
        <span class="live-clock" id="liveClock">--:--</span>
      </div>
      <div class="header-controls">
        <button id="btnThemeToggle" class="ctrl-btn" title="Đổi giao diện sáng / tối" aria-label="Đổi sáng tối">🌓</button>
        <button id="btnFullscreen" class="ctrl-btn" title="Toàn màn hình" aria-label="Toàn màn hình">⛶</button>
      </div>
    </header>

    <!-- 2. KHUNG HIỂN THỊ CHỮ (ĐÚNG 1 DÒNG DUY NHẤT, CHỮ SIÊU TO) -->
    <section class="screen-container">
      <div class="screen-inner" id="screenBox">
        <div id="textDisplay" class="text-display" role="textbox" aria-label="Chữ đang gõ">
          <span class="placeholder">Chạm phím bên dưới để gõ...</span>
        </div>
        <div class="cursor-line" id="cursorLine"></div>
      </div>

      <!-- HÀNG NÚT THAO TÁC -->
      <div class="top-action-bar">
        <button id="btnSpeak" class="act-btn btn-speak" title="Đọc to câu này ra loa">
          <svg class="act-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          <span class="act-text">ĐỌC TO</span>
          <div class="wave-anim" id="waveAnim">
            <span></span><span></span><span></span><span></span>
          </div>
        </button>
        <button id="btnBackspace" class="act-btn btn-backspace" title="Xóa 1 chữ (ấn giữ xóa nhanh)">
          <svg class="act-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0 2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
          <span class="act-text">XÓA 1 CHỮ</span>
        </button>
        <button id="btnClear" class="act-btn btn-clear" title="Xóa hết câu">
          <svg class="act-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
          <span class="act-text">XÓA HẾT</span>
        </button>
      </div>
    </section>

    <!-- 3. THANH TAB ĐIỀU HƯỚNG KIỂU SEGMENTED CONTROL -->
    <nav class="nav-tabs">
      <button id="tabKeyboard" class="nav-tab active" data-tab="keyboard">
        <span>Bàn Phím Chữ</span>
      </button>
      <button id="tabQuickPhrases" class="nav-tab" data-tab="phrases">
        <span>Câu Nói Nhanh</span>
      </button>
      <button id="tabHistory" class="nav-tab" data-tab="history">
        <span>Lịch Sử</span>
      </button>
    </nav>

    <!-- 4. NỘI DUNG CHÍNH (VỪA KHÍT 100% CHIỀU CAO) -->
    <main class="content-viewport">

      <!-- VIEW 1: BÀN PHÍM ẢO TỐI ƯU CẢM ỨNG DI ĐỘNG -->
      <div id="keyboardView" class="panel-view active">

        <!-- HÀNG 1: DẤU THANH (CHỈ HIỂN THỊ KÝ HIỆU DẤU, KHÔNG VIẾT CHỮ) -->
        <div class="k-row row-tones">
          <!-- Dấu Sắc (´) -->
          <button class="k-key key-tone" data-tone="sac" title="Dấu sắc">
            <svg viewBox="0 0 32 32" class="tone-svg"><path d="M11 23L21 9"/></svg>
          </button>
          <!-- Dấu Huyền (ˋ) -->
          <button class="k-key key-tone" data-tone="huyen" title="Dấu huyền">
            <svg viewBox="0 0 32 32" class="tone-svg"><path d="M21 23L11 9"/></svg>
          </button>
          <!-- Dấu Hỏi (̉) -->
          <button class="k-key key-tone" data-tone="hoi" title="Dấu hỏi">
            <svg viewBox="0 0 32 32" class="tone-svg"><path d="M11 13a5 5 0 0 1 9.5-2c0 3.5-5 4.5-5 8"/></svg>
          </button>
          <!-- Dấu Ngã (~) -->
          <button class="k-key key-tone" data-tone="nga" title="Dấu ngã">
            <svg viewBox="0 0 32 32" class="tone-svg"><path d="M7 17c3.5-6 6-6 9 0s5.5 6 9 0"/></svg>
          </button>
          <!-- Dấu Nặng (•) -->
          <button class="k-key key-tone" data-tone="nang" title="Dấu nặng">
            <svg viewBox="0 0 32 32" class="tone-svg-dot"><circle cx="16" cy="18" r="4.8"/></svg>
          </button>
          <!-- Nút Bỏ Dấu (✕) -->
          <button class="k-key key-tone key-clear-tone" data-action="removeTone" title="Bỏ dấu">
            <svg viewBox="0 0 32 32" class="tone-svg-cross"><path d="M10 10l12 12M22 10L10 22"/></svg>
          </button>
        </div>

        <!-- HÀNG 2: NGUYÊN ÂM CÓ DẤU MŨ / MÓC + Đ -->
        <div class="k-row">
          <button class="k-key key-vowel" data-char="Ă">Ă</button>
          <button class="k-key key-vowel" data-char="Â">Â</button>
          <button class="k-key key-vowel" data-char="Ê">Ê</button>
          <button class="k-key key-vowel" data-char="Ô">Ô</button>
          <button class="k-key key-vowel" data-char="Ơ">Ơ</button>
          <button class="k-key key-vowel" data-char="Ư">Ư</button>
          <button class="k-key key-spec-d" data-char="Đ">Đ</button>
        </div>

        <!-- HÀNG 3: NGUYÊN ÂM CƠ BẢN + PHỤ ÂM ĐẦU -->
        <div class="k-row">
          <button class="k-key key-vowel" data-char="A">A</button>
          <button class="k-key key-vowel" data-char="E">E</button>
          <button class="k-key key-vowel" data-char="I">I</button>
          <button class="k-key key-vowel" data-char="O">O</button>
          <button class="k-key key-vowel" data-char="U">U</button>
          <button class="k-key key-vowel" data-char="Y">Y</button>
          <button class="k-key" data-char="B">B</button>
          <button class="k-key" data-char="C">C</button>
        </div>

        <!-- HÀNG 4: CÁC PHỤ ÂM TIẾP THEO -->
        <div class="k-row">
          <button class="k-key" data-char="D">D</button>
          <button class="k-key" data-char="G">G</button>
          <button class="k-key" data-char="H">H</button>
          <button class="k-key" data-char="K">K</button>
          <button class="k-key" data-char="L">L</button>
          <button class="k-key" data-char="M">M</button>
          <button class="k-key" data-char="N">N</button>
          <button class="k-key" data-char="P">P</button>
        </div>

        <!-- HÀNG 5: CÁC PHỤ ÂM CUỐI + DẤU PHẨY, DẤU CHẤM -->
        <div class="k-row">
          <button class="k-key" data-char="Q">Q</button>
          <button class="k-key" data-char="R">R</button>
          <button class="k-key" data-char="S">S</button>
          <button class="k-key" data-char="T">T</button>
          <button class="k-key" data-char="V">V</button>
          <button class="k-key" data-char="X">X</button>
          <button class="k-key key-punct" data-char=",">,</button>
          <button class="k-key key-punct" data-char=".">.</button>
        </div>

        <!-- HÀNG 6: NÚT SỐ + PHÍM CÁCH RỘNG RÃI + DẤU CÂU -->
        <div class="k-row row-bottom">
          <button class="k-key key-toggle-num" id="btnToggleNum" title="Bật/Tắt hàng số">123</button>
          <button class="k-key key-space" data-action="space">
            KHOẢNG CÁCH
          </button>
          <button class="k-key key-punct" data-char="?">?</button>
          <button class="k-key key-punct" data-char="!">!</button>
        </div>

        <!-- HÀNG CHỮ SỐ BẬT/TẮT -->
        <div class="k-row row-numbers" id="rowNumbers">
          <button class="k-key key-num" data-char="1">1</button>
          <button class="k-key key-num" data-char="2">2</button>
          <button class="k-key key-num" data-char="3">3</button>
          <button class="k-key key-num" data-char="4">4</button>
          <button class="k-key key-num" data-char="5">5</button>
          <button class="k-key key-num" data-char="6">6</button>
          <button class="k-key key-num" data-char="7">7</button>
          <button class="k-key key-num" data-char="8">8</button>
          <button class="k-key key-num" data-char="9">9</button>
          <button class="k-key key-num" data-char="0">0</button>
        </div>

      </div>

      <!-- VIEW 2: CÂU NÓI NHANH 1 CHẠM -->
      <div id="quickPhrasesView" class="panel-view">
        <div class="phrases-scroll-area">

          <!-- Nhu cầu cần thiết -->
          <div class="cat-block">
            <div class="cat-title">🚨 Nhu Cầu Cần Thiết</div>
            <div class="cat-grid">
              <button class="p-card card-urgent" data-phrase="Bà muốn uống nước">
                <span class="p-badge">💧</span>
                <span class="p-label">Bà muốn uống nước</span>
              </button>
              <button class="p-card card-urgent" data-phrase="Bà đói, muốn ăn cơm">
                <span class="p-badge">🍚</span>
                <span class="p-label">Bà đói, muốn ăn</span>
              </button>
              <button class="p-card card-urgent" data-phrase="Bà muốn đi vệ sinh">
                <span class="p-badge">🚻</span>
                <span class="p-label">Bà muốn đi vệ sinh</span>
              </button>
              <button class="p-card card-danger" data-phrase="Bà bị đau, lại đây giúp bà với">
                <span class="p-badge">⚠️</span>
                <span class="p-label">Bà bị đau! Giúp bà</span>
              </button>
              <button class="p-card card-rest" data-phrase="Bà mệt, muốn nằm nghỉ">
                <span class="p-badge">🛏️</span>
                <span class="p-label">Bà mệt, muốn nghỉ</span>
              </button>
              <button class="p-card card-rest" data-phrase="Bà muốn ngồi dậy">
                <span class="p-badge">🪑</span>
                <span class="p-label">Bà muốn ngồi dậy</span>
              </button>
            </div>
          </div>

          <!-- Trả lời nhanh -->
          <div class="cat-block">
            <div class="cat-title">💬 Trả Lời Nhanh</div>
            <div class="cat-grid">
              <button class="p-card card-yes" data-phrase="Đúng rồi, có">
                <span class="p-badge">✅</span>
                <span class="p-label">CÓ / ĐÚNG RỒI</span>
              </button>
              <button class="p-card card-no" data-phrase="Không phải, bà không muốn">
                <span class="p-badge">❌</span>
                <span class="p-label">KHÔNG PHẢI</span>
              </button>
              <button class="p-card card-love" data-phrase="Bà cảm ơn con cháu nhiều">
                <span class="p-badge">❤️</span>
                <span class="p-label">Cảm ơn con cháu</span>
              </button>
              <button class="p-card card-comfort" data-phrase="Bà không sao đâu, con cứ yên tâm">
                <span class="p-badge">😊</span>
                <span class="p-label">Bà không sao đâu</span>
              </button>
            </div>
          </div>

          <!-- Cảm giác thời tiết -->
          <div class="cat-block">
            <div class="cat-title">🌡️ Cảm Giác Cơ Thể</div>
            <div class="cat-grid">
              <button class="p-card card-climate" data-phrase="Bà thấy lạnh quá">
                <span class="p-badge">❄️</span>
                <span class="p-label">Bà thấy lạnh</span>
              </button>
              <button class="p-card card-climate" data-phrase="Bà thấy nóng quá, bật quạt giúp bà">
                <span class="p-badge">☀️</span>
                <span class="p-label">Bà nóng, bật quạt</span>
              </button>
            </div>
          </div>

          <!-- Câu riêng gia đình -->
          <div class="cat-block">
            <div class="cat-title">⭐ Câu Riêng Của Gia Đình</div>
            <div class="cat-grid" id="customPhrasesGrid">
              <button id="btnAddCustomPhrase" class="p-card card-add">
                <span class="p-badge">➕</span>
                <span class="p-label">Thêm câu nói mới...</span>
              </button>
            </div>
          </div>

          <!-- Tùy chọn tự đọc -->
          <div class="auto-speak-bar">
            <label class="switch-container">
              <input type="checkbox" id="chkAutoSpeak" checked>
              <span class="switch-slider"></span>
              <span class="switch-text">Tự đọc to khi chạm vào câu nói nhanh</span>
            </label>
          </div>

        </div>
      </div>

      <!-- VIEW 3: LỊCH SỬ CÂU ĐÃ GÕ -->
      <div id="historyView" class="panel-view">
        <div class="history-container">
          <div class="history-top">
            <span>Các câu bà vừa dùng gần đây:</span>
            <button id="btnClearHistory" class="btn-sm-danger">Xóa lịch sử</button>
          </div>
          <div class="history-scroll" id="historyList"></div>
        </div>
      </div>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
